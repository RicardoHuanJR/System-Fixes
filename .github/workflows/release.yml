name: Publicar módulos
on:
  push:
    branches: [main]
    paths:
      - 'modules/oprpg-system-fixes/**'
      - 'scripts/build_release.py'
      - 'scripts/import_staged_system_fixes.py'
      - 'tests/**'
      - '.github/workflows/release.yml'
      - 'incoming/oprpg-system-fixes-v*.zip'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta opcional; em branco, usa a versão do manifesto'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: publicar-modulos
  cancel-in-progress: false
jobs:
  hud-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importar a mesma versão que será publicada
        run: python scripts/import_staged_system_fixes.py
      - name: Obter referência fixa do CORE para a simulação
        run: |
          mkdir -p .local-reference
          git clone --depth 1 --branch 5.0.2 https://github.com/theripper93/enhancedcombathud.git .local-reference/argon-core
          test "$(git -C .local-reference/argon-core rev-parse HEAD)" = dc0ea6b7bfba4dff5defe1b757104db20ebf5f1a
      - name: Preparar ferramentas de teste
        run: |
          npm install --prefix .local-reference/test-runtime --no-audit --no-fund playwright@1.62.1 handlebars@4.7.8
          .local-reference/test-runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Verificar HUD em Chromium com documentos simulados
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.local-reference/test-runtime/node_modules/playwright
        run: |
          node tests/argon-browser-server.cjs > .local-reference/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/argon-browser-check.cjs
          node tests/argon-refinement-check.cjs
      - name: Guardar capturas da simulação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argon-browser-screenshots
          path: .local-reference/hud-*.png
          retention-days: 7
  release:
    needs: hud-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importar versão em espera, se houver
        id: import
        run: python scripts/import_staged_system_fixes.py
      - name: Testar integração Argon e importação
        run: |
          node --test tests/argon-integrated.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Descobrir etiqueta imutável
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          version=json.load(open('modules/oprpg-system-fixes/module.json', encoding='utf-8'))['version']
          tag=os.environ.get('MANUAL_TAG','').strip() or ('v'+version)
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?',tag):
              raise SystemExit('Etiqueta inválida')
          print('tag='+tag)
          PY
      - name: Rejeitar etiqueta já publicada
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::A release $RELEASE_TAG já existe. Incremente a versão em module.json."
            exit 1
          fi
      - name: Validar e compactar os módulos
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Salvar código-fonte validado no Git
        if: steps.import.outputs.imported == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A modules/oprpg-system-fixes incoming/
          git commit -m "release: importar System Fixes $RELEASE_TAG"
          git push origin HEAD:main
      - name: Publicar release com manifesto estável
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.json dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title "Módulos OPRPG — $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
